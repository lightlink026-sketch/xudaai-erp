services:
  xudaai-library:
    build:
      context: .
      args:
        ENABLE_CLIP: ${ENABLE_CLIP:-0}
        ENABLE_MEDIA_AI: ${ENABLE_MEDIA_AI:-0}
    container_name: xudaai-library
    env_file: .env
    environment:
      DATA_DIR: /srv/app/data
      LIBRARY_DIR: /srv/app/library
      DATABASE_URL: ${DATABASE_URL:-sqlite:////srv/app/data/business.sqlite3}
      HF_HOME: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ${APP_DATA_HOST_PATH:-./data}:/srv/app/data
      - ${LIBRARY_HOST_PATH:-./library}:/srv/app/library
      - ${MODEL_CACHE_HOST_PATH:-./model-cache}:/root/.cache
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    profiles: [team]
    container_name: xudaai-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-xudaai}
      POSTGRES_USER: ${POSTGRES_USER:-xudaai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-before-team-use}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
volumes:
  postgres_data:
