services:
  xudaai-library:
    build:
      context: .
      args:
        ENABLE_CLIP: ${ENABLE_CLIP:-0}
        ENABLE_MEDIA_AI: ${ENABLE_MEDIA_AI:-0}
    container_name: xudaai-library
    env_file: .env
    environment:
      DATA_DIR: /srv/app/data
      LIBRARY_DIR: /srv/app/library
      HF_HOME: /root/.cache/huggingface
      TORCH_HOME: /root/.cache/torch
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      - ${APP_DATA_HOST_PATH:-./data}:/srv/app/data
      - ${LIBRARY_HOST_PATH:-./library}:/srv/app/library
      - ${MODEL_CACHE_HOST_PATH:-./model-cache}:/root/.cache
    restart: unless-stopped
